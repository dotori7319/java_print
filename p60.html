<html>

  <body>
    <script>
      var stringValue = "soda, naichaisoda";
      var positions = new Array();
      var pos = stringValue.indexOf("n");

      while (pos > -1) {
        positions.push(pos);
        pos = stringValue.indexOf("n", pos + 1);
      }
      alert(positions);
    </script>
  </body>
