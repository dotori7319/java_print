    <script>
      var stringValue = "oh captain, my captain.";
      alert(stringValue.slice(3)); //captain, my captain.
      alert(stringValue.substring(3)); //captain, my captain.
      alert(stringValue.substr(3)); //captain, my captain.
      alert(stringValue.slice(3, 7)); //capt
      alert(stringValue.substring(3, 7)); //capt
      alert(stringValue.substr(3, 7)); //captain 왜 얘만 달라? - 뒤 숫자는 총 출력 숫자.
    </script>
