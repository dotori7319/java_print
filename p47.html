<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      var person1 = new Object();
      person1.name = "Rahti";
      person1.age = 22;

      var person2 = {
        name: "Bryne",
        age: 23,
      };

      var person3 = {};
      person3.name = "Kai";
      person3.age = 23;

      document.write(person1.name + ":" + person1.age + "<br/>");
      document.write(person2.name + ":" + person2.age + "<br/>");
      document.write(person3.name + ":" + person3.age + "<br/>");
    </script>
  </body>
</html>
