<!doctype html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
      crossorigin="anonymous"
    ></script>
    <meta charset="utf-8" />
    <script>
      var expression = "";

      function add(character) {
        expression = expression + character;
        document.getElementById("display").value = expression;
      }
      function compute() {
        expression = eval(expression);
        document.getElementById("display").value = eval(expression);
      }
      function clearDisplay() {
        expression = "";
        document.getElementById("display").value = 0;
      }
    </script>
  </head>
  <body>
    <form>
      display<input id="display" value="0" size="50" />
      <br />
      <div
        class="btn-group"
        role="group"
        aria-label="Basic mixed styles example"
      >
        <input
          type="button"
          value=" 7 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('7')"
        />
        <input
          type="button"
          value=" 8 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('8')"
        />
        <input
          type="button"
          value=" 9 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('9')"
        />
        <input
          type="button"
          value=" / "
          class="btn-solid btn-styled theme-inverse"
          onclick="add('/')"
        />
      </div>
      <br />
      <div
        class="btn-group"
        role="group"
        aria-label="Basic mixed styles example"
      >
        <input
          type="button"
          value=" 4 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('4')"
        />
        <input
          type="button"
          value=" 5 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('5')"
        />
        <input
          type="button"
          value=" 6 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('6')"
        />
        <input
          type="button"
          value=" * "
          class="btn-solid btn-styled theme-inverse"
          onclick="add('*')"
        />
      </div>
      <br />
      <div
        class="btn-group"
        role="group"
        aria-label="Basic mixed styles example"
      >
        <input
          type="button"
          value=" 1 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('1')"
        />
        <input
          type="button"
          value=" 2 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('2')"
        />
        <input
          type="button"
          value=" 3 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('3')"
        />
        <input
          type="button"
          value=" - "
          class="btn-solid btn-styled theme-inverse"
          onclick="add('-')"
        />
      </div>
      <br />
      <div
        class="btn-group"
        role="group"
        aria-label="Basic mixed styles example"
      >
        <input
          type="button"
          value=" ( "
          class="btn-solid btn-styled theme-inverse"
          onclick="add('(')"
        />
        <input
          type="button"
          value=" 0 "
          class="btn-solid btn-styled theme-secondary"
          onclick="add('0')"
        />
        <input
          type="button"
          value=" ) "
          class="btn-solid btn-styled theme-inverse"
          onclick="add(')')"
        />
        <input
          type="button"
          value=" + "
          class="btn-solid btn-styled theme-inverse"
          onclick="add('+')"
        />
      </div>
      <br />
      <div
        class="btn-group"
        role="group"
        aria-label="Basic mixed styles example"
      >
        <input
          type="button"
          value="Clear"
          class="btn-solid btn-styled theme-danger"
          onclick="clearDisplay()"
        />
        <input
          type="button"
          value="Enter"
          class="btn-solid btn-styled theme-primary"
          name="enter"
          onclick="compute()"
        />
      </div>
    </form>
  </body>
</html>
